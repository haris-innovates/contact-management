spring.application.name=contact-management
# Server
server.port=8080

# SQL Server
# Server
server.port=8080

# SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=contact_db;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Admin@1234
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=your-very-long-secret-key-minimum-256-bits-long-here-make-it-long
jwt.expiration=86400000

# Logging
logging.level.com.contactmgmt=DEBUG
logging.level.org.springframework.security=DEBUG